name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # A hung step must fail quickly, not hold a runner for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Ruff is a development tool, not a plugin dependency: pinned by hash here only.
      - run: "python -m pip install --require-hashes --no-deps --only-binary :all: -r .github/ruff-requirements.txt"
      - run: ruff check backend tools tests
      - run: ruff format --check backend tools tests
      - name: Check manifest JSON
        run: python -m json.tool manifest.json > /dev/null

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the newest stable release.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # Installs the pinned, hash-verified websockets wheel, as on first use.
      - name: Prepare the managed runtime
        run: python backend/vessel.py --prepare-runtime
      - name: Run portable checks, including local WebSocket peers
        run: ./tests/run
